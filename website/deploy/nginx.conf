# InputBetter 官网。由共享 Caddy(/opt/proxy)以 inputbetter-web:8080 反向代理并提供 HTTPS。
# 不记录访问日志(与服务器上其他站点一致)。
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    access_log off;
    server_tokens off;

    location = /index.html { add_header Cache-Control "no-cache"; }
    location / { try_files $uri $uri/ =404; add_header Cache-Control "no-cache"; }
    location /assets/ { add_header Cache-Control "public, max-age=86400"; }

    # Passport 固件(scripts/package-firmware.sh 生成):清单不缓存,发布后立即生效;
    # 镜像放在带版本和构建标识的目录里,内容不会变,可以长缓存。app 和网页刷写都从这里下载。
    location = /firmware/manifest.json {
        default_type application/json;
        add_header Cache-Control "no-cache";
    }
    location /firmware/ {
        types { application/octet-stream bin; }
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # 安装包:按附件下载,文件名带版本号,可以长缓存。
    location /download/ {
        types { application/x-apple-diskimage dmg; text/plain sha256; }
        add_header Content-Disposition "attachment";
        add_header Cache-Control "public, max-age=31536000, immutable";
    }
}
